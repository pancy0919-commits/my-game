<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的線上筆記本</title>
    <style>
        body {
            background: #fdf6e2;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .notebook {
            background: #ffffff;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 6px solid #e76f51;
        }
        h1 {
            font-size: 22px;
            color: #264653;
            margin-top: 0;
        }
        p {
            color: #555;
            line-height: 1.8;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="notebook">
        <h1>我的故事筆記本</h1>
        <p>歡迎來到我的筆記本！這裡可以寫你想寫的故事、文字或遊戲內容，隨時透過專屬網址就能打開閱讀喔！</p>
    </div>
</body>
</html>
