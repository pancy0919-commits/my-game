<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的線上打字筆記本</title>
    <style>
        body {
            background: #fdf6e2;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .notebook {
            background: #ffffff;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 6px solid #e76f51;
        }
        h1 {
            font-size: 20px;
            color: #264653;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* 這邊就是讓你可以打字的大框框樣式 */
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            font-size: 16px;
            font-family: sans-serif;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            border-color: #e76f51;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="notebook">
        <h1>我的隨身筆記本</h1>
        <!-- 這個標籤就是打字輸入框 -->
        <textarea placeholder="點這裡就可以直接開始打字囉..."></textarea>
    </div>
</body>
</html>
